services:
  bot:
    build: .
    env_file: .env
    # Port hanya dipakai di GITHUB_MODE=webhook/both
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./aliases.yaml:/app/aliases.yaml:ro
      - tg-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

  # Opsional: video sampai ~2 GB. Jalankan: docker compose --profile localapi up -d
  # Lalu set TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081 dan TELEGRAM_LOCAL_MODE=true
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["localapi"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  tg-bot-api:
